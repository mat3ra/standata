isDefault: true
monitors:
  - name: standard_output
  - name: jupyter_notebook_endpoint
results: []
flavors:
  notebook:
    # The version ranges below are disjoint, so each version line has exactly one default flavor.
    isDefault: true
    supportedApplicationVersions: "~4.6"
    input:
      - name: requirements.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter

  notebook_430:
    isDefault: true
    supportedApplicationVersions: "~4.3"
    input:
      - name: requirements.txt
        templateName: requirements_430.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter

  notebook_303:
    isDefault: true
    supportedApplicationVersions: "<4"
    input:
      - name: requirements.txt
        templateName: requirements_303.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter

  notebook_mat3ra:
    supportedApplicationVersions: "~4.6"
    input:
      - name: requirements.txt
        templateName: requirements_mat3ra.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter
