application:
  name: shell
  version: 5.1.8
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Custom Shell Script
units:
  # Fetches the user's script, and any files it reads, from object storage. The inputs are added
  # per job — one entry per uploaded file — since the objects only exist once they are uploaded.
  - config:
      name: io-user-files
      subtype: input
      source: object_storage
      input: []
    type: io
  - config:
      name: io-material
      subtype: input
      source: api
      # Pinned because assign-material reads this unit's scope by id. Namespaced by subworkflow so
      # it cannot clash if another subworkflow in the same workflow also fetches a material.
      flowchartId: custom-shell-io-material
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': MATERIAL_ID}"
              projection: "{}"
          name: DATA
    type: io
  - config:
      name: assign-material
      operand: MATERIAL
      value: "DATA[0]"
      input:
        - name: DATA
          scope: custom-shell-io-material
    type: assignment
  - config:
      execName: sh
      flavorName: hello_world
      name: custom_script
    type: executionBuilder
