# Fetches the valence band maximum (eV) of a material: the valence-band eigenvalue of the indirect
# gap in its highest-precision band_gaps property. Resolve the material first (e.g. with
# shell/utils/get_material_by_index) and override the first unit's value to reference it.
#
# In:  MATERIAL             material whose band_gaps to read (override the first unit's value)
#      VBM_GROUP            method group the band_gaps must belong to (default 'qe:')
# Out: E_VBM                valence band maximum (eV), or None when no band_gaps matches or
#                           it has no indirect gap with a valence eigenvalue
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Valence Band Maximum for Material
units:
  - type: assignment
    config:
      name: assign-vbm-material
      flowchartId: assign-vbm-material
      operand: VBM_MATERIAL
      value: "MATERIAL"
  - type: assignment
    config:
      name: assign-vbm-group
      flowchartId: assign-vbm-group
      operand: VBM_GROUP
      value: "'qe:'"
  - type: io
    config:
      name: io-band-gaps
      flowchartId: io-band-gaps
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': VBM_MATERIAL.exabyteId, 'slug': 'band_gaps',
                'group': {'$regex': VBM_GROUP},
                'owner._id': VBM_MATERIAL.owner['_id']}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-vbm
      flowchartId: assign-vbm
      operand: E_VBM
      value: >-
        ([gap.get('eigenvalueValence') for gap in DATA[0].data.get('values', [])
        if gap.get('type') == 'indirect'] + [None])[0] if DATA else None
      input:
        - name: DATA
          scope: io-band-gaps
