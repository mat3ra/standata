# Load the interface material, resolve substrate/film bulk references from build
# metadata, and compute supercell stoichiometry (N_SUBSTRATE, N_FILM, N_INTERFACES).
#
# In:  MATERIAL_ID
# Out: INTERFACE, BULK_SUBSTRATE, BULK_FILM, BULK_*_MATERIAL_IDS,
#      N_SUBSTRATE, N_FILM, N_INTERFACES
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Load Interface and Resolve References
units:
  - type: io
    config:
      name: io-interface
      flowchartId: io-interface
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': MATERIAL_ID}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-interface
      flowchartId: assign-interface
      operand: INTERFACE
      value: "DATA[0] if len(DATA) == 1 else None"
      input:
        - name: DATA
          scope: io-interface
  - type: assignment
    config:
      name: assign-crystal-substrate
      flowchartId: assign-crystal-substrate
      operand: CRYSTAL_SUBSTRATE
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}])[0].get('stack_components',
        [{}])[0].get('crystal') if INTERFACE.metadata else None
  - type: assertion
    config:
      name: assert-crystal-substrate
      flowchartId: assert-crystal-substrate
      statement: "CRYSTAL_SUBSTRATE != None"
      errorMessage: >-
        Could not extract the substrate crystal from the interface
        build metadata.
  - type: io
    config:
      name: io-bulk-substrate
      flowchartId: io-bulk-substrate
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'hash': CRYSTAL_SUBSTRATE.get('hash')}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-bulk-substrate
      flowchartId: assign-bulk-substrate
      operand: BULK_SUBSTRATE
      value: "DATA[0] if DATA else None"
      input:
        - name: DATA
          scope: io-bulk-substrate
  - type: assignment
    config:
      name: assign-bulk-substrate-material-ids
      flowchartId: assign-bulk-substrate-material-ids
      operand: BULK_SUBSTRATE_MATERIAL_IDS
      value: "[m['_id'] for m in DATA] if DATA else []"
      input:
        - name: DATA
          scope: io-bulk-substrate
  - type: assertion
    config:
      name: assert-bulk-substrate
      flowchartId: assert-bulk-substrate
      statement: "BULK_SUBSTRATE != None"
      errorMessage: >-
        No material matched the substrate crystal hash.
        Upload the bulk material first.
  - type: assignment
    config:
      name: assign-crystal-film
      flowchartId: assign-crystal-film
      operand: CRYSTAL_FILM
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}, {}])[1].get('stack_components',
        [{}])[0].get('crystal') if INTERFACE.metadata else None
  - type: assertion
    config:
      name: assert-crystal-film
      flowchartId: assert-crystal-film
      statement: "CRYSTAL_FILM != None"
      errorMessage: >-
        Could not extract the film crystal from the interface
        build metadata.
  - type: io
    config:
      name: io-bulk-film
      flowchartId: io-bulk-film
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'hash': CRYSTAL_FILM.get('hash')}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-bulk-film
      flowchartId: assign-bulk-film
      operand: BULK_FILM
      value: "DATA[0] if DATA else None"
      input:
        - name: DATA
          scope: io-bulk-film
  - type: assignment
    config:
      name: assign-bulk-film-material-ids
      flowchartId: assign-bulk-film-material-ids
      operand: BULK_FILM_MATERIAL_IDS
      value: "[m['_id'] for m in DATA] if DATA else []"
      input:
        - name: DATA
          scope: io-bulk-film
  - type: assertion
    config:
      name: assert-bulk-film
      flowchartId: assert-bulk-film
      statement: "BULK_FILM != None"
      errorMessage: >-
        No material matched the film crystal hash.
        Upload the bulk material first.
  - type: assignment
    config:
      name: assign-bulk-substrate-natoms
      flowchartId: assign-bulk-substrate-natoms
      operand: BULK_SUBSTRATE_NATOMS
      value: "len(BULK_SUBSTRATE.basis.elements)"
  - type: assignment
    config:
      name: assign-bulk-film-natoms
      flowchartId: assign-bulk-film-natoms
      operand: BULK_FILM_NATOMS
      value: "len(BULK_FILM.basis.elements)"
  - type: assignment
    config:
      name: assign-n-substrate
      flowchartId: assign-n-substrate
      operand: N_SUBSTRATE
      value: >-
        len([e for e in INTERFACE.basis.elements if e.value in [x.value for x in
        BULK_SUBSTRATE.basis.elements]]) / BULK_SUBSTRATE_NATOMS
  - type: assignment
    config:
      name: assign-n-film
      flowchartId: assign-n-film
      operand: N_FILM
      value: >-
        len([e for e in INTERFACE.basis.elements if e.value in [x.value for x in
        BULK_FILM.basis.elements] and e.value not in [x.value for x in
        BULK_SUBSTRATE.basis.elements]]) / BULK_FILM_NATOMS
  - type: assignment
    config:
      name: assign-vacuum-size
      flowchartId: assign-vacuum-size
      operand: VACUUM_SIZE
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}, {}, {}])[2].get('size', 0)
        if INTERFACE.metadata else 0
  - type: assignment
    config:
      name: assign-n-interfaces
      flowchartId: assign-n-interfaces
      operand: N_INTERFACES
      value: "1 if VACUUM_SIZE != 0 else 2"
