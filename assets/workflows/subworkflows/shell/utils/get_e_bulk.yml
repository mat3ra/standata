# Fetch precomputed bulk total energy (E_BULK) for a material already in context.
#
# In:  BULK, SLAB
# Out: E_BULK
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Get Bulk Energy
units:
  - type: assignment
    config:
      name: assign-bulk-te-group
      flowchartId: assign-bulk-te-group
      operand: BULK_TE_GROUP
      value: "'qe:'"
  - type: io
    config:
      name: io-e-bulk
      flowchartId: io-e-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': BULK.exabyteId, 'slug': 'total_energy',
                'group': {'$regex': BULK_TE_GROUP}, 'owner._id': SLAB.owner['_id']}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-e-bulk
      flowchartId: assign-e-bulk
      operand: E_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-e-bulk
  - type: assertion
    config:
      name: assert-e-bulk
      flowchartId: assert-e-bulk
      statement: "E_BULK != None"
      errorMessage: >-
        No total energy for this bulk material in this account. Run a bulk total energy workflow
        for it first.
