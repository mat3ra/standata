# Fetch the precomputed bulk total energy (E_BULK) for the bulk already in context.
#
# In:  BULK (bulk material document), SLAB (the job's own material)
# Out: E_BULK
#
# Read from `properties`, not from a job. A total energy exists as a property whether or not the
# job that produced it is visible to this account, and matching jobs by workflow name is neither
# necessary nor reliable.
#
# Scoped to the slab's owner: E_BULK is subtracted from an SCF this job is about to run, so it is
# only valid if both share the cutoff, k-grid and pseudopotentials -- which only holds for an
# energy this account computed itself. `group` pins the code and functional, not the convergence.
# `exabyteId` is shared by every copy of a material, so this stays correct whichever copy BULK
# resolved to.
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Get Bulk Energy
units:
  - type: assignment
    config:
      name: assign-bulk-te-group
      flowchartId: assign-bulk-te-group
      operand: BULK_TE_GROUP
      value: "'qe:'"
  - type: io
    config:
      name: io-e-bulk
      flowchartId: io-e-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': BULK.exabyteId, 'slug': 'total_energy',
                'group': {'$regex': BULK_TE_GROUP}, 'owner._id': SLAB.owner._id}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-e-bulk
      flowchartId: assign-e-bulk
      operand: E_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-e-bulk
  - type: assertion
    config:
      name: assert-e-bulk
      flowchartId: assert-e-bulk
      statement: "E_BULK != None"
      errorMessage: >-
        No total energy for this bulk material in this account. Run a bulk total energy workflow
        for it first.
