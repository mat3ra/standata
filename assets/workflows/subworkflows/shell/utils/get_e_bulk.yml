# Fetch precomputed bulk total energy (E_BULK) for a material already in context.
#
# In:  BULK_MATERIAL_IDS — all platform material _ids sharing the bulk hash
# Out: BULK_TE_JOB_ID, E_BULK
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Get Bulk Energy
units:
  - type: io
    config:
      name: io-bulk-te-job
      flowchartId: io-bulk-te-job
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': {'$in': BULK_MATERIAL_IDS}, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id
      flowchartId: assign-bulk-te-job-id
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job
  - type: io
    config:
      name: io-e-bulk
      flowchartId: io-e-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              # `APP` is replaced by the app shortname in the parent workflow yaml
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'APP:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-e-bulk
      flowchartId: assign-e-bulk
      operand: E_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-e-bulk
  - type: assertion
    config:
      name: assert-e-bulk
      flowchartId: assert-e-bulk
      statement: "E_BULK != None"
      errorMessage: >-
        Bulk total energy does not exist for the resolved bulk material. Run a
        bulk total energy workflow first.
