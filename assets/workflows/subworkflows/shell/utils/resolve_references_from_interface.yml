# Derives N_A, N_B from interface atom labels and bulk atom counts.
# Sets N_INTERFACES to a default value (user can override via unitConfigs).
#
# In:  INTERFACE (material document with substrate=0 / film=1 atom labels)
#      BULK_A, BULK_B (material documents)
# Out: N_A, N_B (formula unit counts)
#      N_INTERFACES (default 2, user-adjustable)
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Resolve Interface Parameters
units:
  # Atoms in each bulk unit cell
  - type: assignment
    config:
      name: assign-bulk-a-natoms
      flowchartId: assign-bulk-a-natoms
      operand: BULK_A_NATOMS
      value: "len(BULK_A.basis.elements)"
  - type: assignment
    config:
      name: assign-bulk-b-natoms
      flowchartId: assign-bulk-b-natoms
      operand: BULK_B_NATOMS
      value: "len(BULK_B.basis.elements)"

  # N_A = substrate atoms (label==0) in interface / atoms per unit cell of bulk A
  - type: assignment
    config:
      name: assign-n-a
      flowchartId: assign-n-a
      operand: N_A
      value: "len([l for l in INTERFACE.basis.labels if l.value == 0]) / BULK_A_NATOMS"
  - type: assignment
    config:
      name: assign-n-b
      flowchartId: assign-n-b
      operand: N_B
      value: "len([l for l in INTERFACE.basis.labels if l.value == 1]) / BULK_B_NATOMS"

  # Default N_INTERFACES = 2 (no vacuum). Override via unitConfigs for vacuum case.
  - type: assignment
    config:
      name: assign-n-interfaces
      flowchartId: assign-n-interfaces
      operand: N_INTERFACES
      value: "2"
