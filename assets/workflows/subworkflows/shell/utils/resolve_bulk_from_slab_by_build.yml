application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Resolve Bulk From Slab By Build
units:
  - type: condition
    config:
      name: is-bulk-present
      flowchartId: is-bulk-present
      statement: "BULK is not None"
      then: done
      else: assign-crystal
  - type: assignment
    config:
      name: assign-crystal
      flowchartId: assign-crystal
      operand: LAST_BUILD_CRYSTAL
      value: >-
        (((SLAB.metadata.get('build') or [{}])[-1].get('configuration') or {}).get(
        'stack_components'
        ) or [{}])[0].get('crystal') if SLAB.metadata else None
  - type: assignment
    config:
      name: assign-bulk-id-by-build
      flowchartId: assign-bulk-id-by-build
      operand: BULK_ID_BY_BUILD
      value: "LAST_BUILD_CRYSTAL.get('_id') if LAST_BUILD_CRYSTAL else None"
  - type: assignment
    config:
      name: assign-bulk-hash
      flowchartId: assign-bulk-hash
      operand: BULK_HASH
      value: >-
        None if BULK_ID_BY_BUILD
        else LAST_BUILD_CRYSTAL.get('hash') if LAST_BUILD_CRYSTAL
        else None
  - type: assignment
    config:
      name: assign-bulk-scaled-hash
      flowchartId: assign-bulk-scaled-hash
      operand: BULK_SCALED_HASH
      value: >-
        None if (BULK_ID_BY_BUILD or BULK_HASH)
        else LAST_BUILD_CRYSTAL.get('scaledHash') if LAST_BUILD_CRYSTAL
        else None
  - type: assertion
    config:
      name: assert-bulk-query
      flowchartId: assert-bulk-query
      statement: "BULK_ID_BY_BUILD is not None or BULK_HASH is not None or BULK_SCALED_HASH is not None"
      errorMessage: >-
        Surface slab build metadata does not carry a crystal _id, hash, or scaledHash.
        Upload the bulk material and run its total energy workflow first.
  - type: io
    config:
      name: io-bulk-by-build
      flowchartId: io-bulk-by-build
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              # requests drops a None-valued param, so only whichever of the three is actually
              # set (id preferred, then hash, then scaledHash - see the assignments above) is sent.
              id: "BULK_ID_BY_BUILD"
              hashes: "BULK_HASH"
              scaledHashes: "BULK_SCALED_HASH"
          name: DATA
  - type: assignment
    config:
      name: assign-bulk-by-build
      flowchartId: assign-bulk-by-build
      operand: BULK
      value: "DATA[0] if DATA else None"
      input:
        - name: DATA
          scope: io-bulk-by-build
  - type: assignment
    config:
      name: assign-bulk-material-ids-by-build
      flowchartId: assign-bulk-material-ids-by-build
      operand: BULK_MATERIAL_IDS
      value: "[m['_id'] for m in DATA] if DATA else []"
      input:
        - name: DATA
          scope: io-bulk-by-build
  - type: assertion
    config:
      name: assert-bulk
      flowchartId: assert-bulk
      statement: "BULK != None"
      errorMessage: >-
        No bulk material matched the resolved slab build metadata query.
        Upload the bulk material and run its total energy workflow first.
  - type: assignment
    config:
      name: done-by-build
      flowchartId: done-by-build
      operand: BULK
      value: "BULK"
      input:
        - name: BULK
          scope: global
