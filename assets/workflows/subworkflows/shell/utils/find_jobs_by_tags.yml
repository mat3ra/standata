# Finds the finished jobs on a material that carry every given tag, and returns a filter on a
# property's source.info.jobId that selects them (e.g. for fetch_bulk_total_energy's
# TE_BULK_JOB_FILTER). With no tags the filter matches any job.
#
# In:  MATERIAL              material whose jobs to search (override the first unit's value)
#      REFERENCE_TAGS        tags every job must carry, e.g. ['charge:0'] (default: none)
# Out: REFERENCE_JOB_FILTER  {'$in': [matching job ids]}, or {'$nin': []} without tags
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Find Jobs By Tags
units:
  - type: assignment
    config:
      name: assign-tagged-jobs-material
      flowchartId: assign-tagged-jobs-material
      operand: TAGGED_JOBS_MATERIAL
      value: "MATERIAL"
  - type: assignment
    config:
      name: assign-reference-tags
      flowchartId: assign-reference-tags
      operand: REFERENCE_TAGS
      value: "[]"
  - type: io
    config:
      name: io-tagged-jobs
      flowchartId: io-tagged-jobs
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': TAGGED_JOBS_MATERIAL['_id'], 'status': 'finished',
                'tags': {'$all': REFERENCE_TAGS}}
              projection: "{'_id': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-reference-job-filter
      flowchartId: assign-reference-job-filter
      operand: REFERENCE_JOB_FILTER
      value: "{'$in': [job['_id'] for job in DATA]} if REFERENCE_TAGS else {'$nin': []}"
      input:
        - name: DATA
          scope: io-tagged-jobs
