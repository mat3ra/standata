# Fetches a bulk reference material (by MATERIAL_INDEX) and its total energy
# from a previously-finished Total Energy job -- does not recompute it.

# In:  MATERIAL_INDEX  position of the bulk in the job's material list
#      JOB_ID          current job id, from the default eval context
# Out: BULK            bulk reference material document (for stoichiometry)
#      TE_BULK         bulk reference total energy (eV)
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Bulk Total Energy
units:
  - type: assignment
    config:
      name: set-material-index
      description: |
        Position of this bulk reference in the multi-material job's material
        list. Default 1; override per instance via unitConfigs.
      flowchartId: set-material-index
      operand: MATERIAL_INDEX
      value: "1"
  - type: io
    config:
      name: io-job-materials
      description: |
        Read the job's ordered material list to resolve the bulk _id by index
        (the bulk itself is not recomputed here).
      flowchartId: io-job-materials
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: "{'_id': JOB_ID}"
              projection: "{'_materials': 1}"
          name: JOB_MATERIALS_DATA
  - type: assignment
    config:
      name: assign-bulk-material-id
      description: |
        The bulk reference material _id, used to load its document and find its
        Total Energy job.
      flowchartId: assign-bulk-material-id
      operand: BULK_MATERIAL_ID
      value: "JOB_MATERIALS_DATA[0]['_materials'][MATERIAL_INDEX]['_id'] if JOB_MATERIALS_DATA else None"
      input:
        - name: JOB_MATERIALS_DATA
          scope: io-job-materials
  - type: io
    config:
      name: io-bulk-material
      description: |
        Load the full bulk material document. Its basis is used downstream to
        count how many bulk formula units the interface contains.
      flowchartId: io-bulk-material
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': BULK_MATERIAL_ID}"
              projection: "{}"
          name: BULK_MATERIAL_DATA
  - type: assignment
    config:
      name: assign-bulk
      description: |
        The bulk reference material document. Override this operand per instance
        (e.g. BULK_SUBSTRATE, BULK_FILM).
      flowchartId: assign-bulk
      operand: BULK
      value: "BULK_MATERIAL_DATA[0] if BULK_MATERIAL_DATA else None"
      input:
        - name: BULK_MATERIAL_DATA
          scope: io-bulk-material
  - type: io
    config:
      name: io-bulk-te-job
      description: |
        Most recent finished Total Energy job run on this bulk reference.
      flowchartId: io-bulk-te-job
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': BULK_MATERIAL_ID, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id
      description: |
        The _id of that Total Energy job, used to fetch its total_energy property.
      flowchartId: assign-bulk-te-job-id
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job
  - type: io
    config:
      name: io-te-bulk
      description: |
        Highest-precision total_energy produced by that job. The 'qe:' group
        restricts the match to Quantum ESPRESSO results.
      flowchartId: io-te-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'qe:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-te-bulk
      description: |
        The bulk reference total energy (eV). Override this operand per instance
        (e.g. TE_BULK_SUBSTRATE, TE_BULK_FILM).
      flowchartId: assign-te-bulk
      operand: TE_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-te-bulk
  - type: assertion
    config:
      name: assert-te-bulk
      flowchartId: assert-te-bulk
      statement: "TE_BULK != None"
      errorMessage: >-
        Bulk total energy not found for a reference material. Run a Total Energy
        workflow on each bulk reference before running this workflow.
