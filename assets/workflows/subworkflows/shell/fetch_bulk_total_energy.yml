# Fetches total energy (eV) for an already-resolved bulk reference material --
# does not load/resolve the material itself. Reuse shell/utils/get_material_by_index
# first to load it and name the result (e.g. PRISTINE, BULK_SUBSTRATE, BULK_FILM),
# then override this subworkflow's first unit's value to reference that operand.
#
# In:  MATERIAL         resolved bulk reference material (default operand MATERIAL
#                       from get_material_by_index; override the first unit's value
#                       per instance, e.g. PRISTINE, BULK_SUBSTRATE, BULK_FILM)
# Out: TE_BULK          bulk reference total energy (eV); override this operand
#                       per instance (e.g. E_PRISTINE, TE_BULK_SUBSTRATE, TE_BULK_FILM)
#
# Optional per instance: REFERENCE_TAGS restricts the lookup to properties of finished
# jobs on the material that carry all of these tags (e.g. ['charge:0']); TE_BULK_SLUG
# reads another property of the same reference (e.g. 'band_gaps').
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Total Energy for Bulk Material
units:
  - type: assignment
    config:
      name: assign-bulk-material
      flowchartId: assign-bulk-material
      operand: BULK_MATERIAL
      value: "MATERIAL"
  - type: assignment
    config:
      name: assign-te-bulk-group
      description: |
        Method group the total energy must belong to. Override per application
        (e.g. 'vasp:').
      flowchartId: assign-te-bulk-group
      operand: TE_BULK_GROUP
      value: "'qe:'"
  - type: assignment
    config:
      name: assign-te-bulk-slug
      flowchartId: assign-te-bulk-slug
      operand: TE_BULK_SLUG
      value: "'total_energy'"
  - type: assignment
    config:
      name: assign-reference-tags
      description: |
        Tags every reference job must carry. Empty: any job on the material.
      flowchartId: assign-reference-tags
      operand: REFERENCE_TAGS
      value: "[]"
  - type: io
    config:
      name: io-reference-jobs
      flowchartId: io-reference-jobs
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': BULK_MATERIAL['_id'], 'status': 'finished',
                'tags': {'$all': REFERENCE_TAGS}}
                if REFERENCE_TAGS else {'_id': {'$in': []}}
              projection: "{'_id': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-reference-job-ids
      flowchartId: assign-reference-job-ids
      operand: REFERENCE_JOB_IDS
      value: "[job['_id'] for job in JOB_DATA]"
      input:
        - name: JOB_DATA
          scope: io-reference-jobs
  - type: io
    config:
      name: io-te-bulk
      description: |
        Highest-precision property for this material in this account, from the
        tagged reference jobs when REFERENCE_TAGS is set.
      flowchartId: io-te-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': BULK_MATERIAL.exabyteId, 'slug': TE_BULK_SLUG,
                'group': {'$regex': TE_BULK_GROUP},
                'owner._id': BULK_MATERIAL.owner['_id'],
                'source.info.jobId': {'$in': REFERENCE_JOB_IDS}}
                if REFERENCE_TAGS else
                {'exabyteId': BULK_MATERIAL.exabyteId, 'slug': TE_BULK_SLUG,
                'group': {'$regex': TE_BULK_GROUP},
                'owner._id': BULK_MATERIAL.owner['_id']}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-te-bulk
      description: |
        The bulk reference total energy (eV). Override this operand per instance
        (e.g. E_PRISTINE, TE_BULK_SUBSTRATE, TE_BULK_FILM).
      flowchartId: assign-te-bulk
      operand: TE_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-te-bulk
  - type: assertion
    config:
      name: assert-te-bulk
      flowchartId: assert-te-bulk
      statement: "TE_BULK != None"
      errorMessage: >-
        Bulk total energy not found for a reference material in this account. Run a
        Total Energy workflow on each bulk reference before running this workflow.
