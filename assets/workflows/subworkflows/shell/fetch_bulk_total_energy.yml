# Fetches total energy (eV) for an already-resolved bulk reference material --
# does not load/resolve the material itself. Reuse shell/utils/get_material_by_index
# first to load it and name the result (e.g. PRISTINE, BULK_SUBSTRATE, BULK_FILM),
# then override this subworkflow's first unit's value to reference that
# operand's `_id`.
#
# In:  MATERIAL['_id']  resolved bulk reference material's _id (default operand
#                        MATERIAL from get_material_by_index; override the
#                        first unit's value per instance to reference whatever
#                        operand the preceding Load stage used, e.g.
#                        PRISTINE['_id'], BULK_SUBSTRATE['_id'], BULK_FILM['_id'])
# Out: TE_BULK           bulk reference total energy (eV); override this operand
#                        per instance (e.g. E_PRISTINE, TE_BULK_SUBSTRATE, TE_BULK_FILM)
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Total Energy for Bulk Material
units:
  - type: assignment
    config:
      name: assign-bulk-material-id
      description: |
        _id of the resolved bulk reference material, used to look up its most
        recent finished Total Energy job.
      flowchartId: assign-bulk-material-id
      operand: BULK_MATERIAL_ID
      value: "MATERIAL['_id']"
  - type: io
    config:
      name: io-bulk-te-job
      description: |
        Most recent finished Total Energy job run on this bulk reference.
      flowchartId: io-bulk-te-job
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': BULK_MATERIAL_ID, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id
      description: |
        The _id of that Total Energy job, used to fetch its total_energy property.
      flowchartId: assign-bulk-te-job-id
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job
  - type: io
    config:
      name: io-te-bulk
      description: |
        Highest-precision total_energy produced by that job. The 'qe:' group
        restricts the match to Quantum ESPRESSO results.
      flowchartId: io-te-bulk
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'qe:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-te-bulk
      description: |
        The bulk reference total energy (eV). Override this operand per instance
        (e.g. E_PRISTINE, TE_BULK_SUBSTRATE, TE_BULK_FILM).
      flowchartId: assign-te-bulk
      operand: TE_BULK
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-te-bulk
  - type: assertion
    config:
      name: assert-te-bulk
      flowchartId: assert-te-bulk
      statement: "TE_BULK != None"
      errorMessage: >-
        Bulk total energy not found for a reference material. Run a Total Energy
        workflow on each bulk reference before running this workflow.
