# Load the interface material, resolve substrate/film bulk references from build
# metadata, and compute supercell stoichiometry (N_A, N_B, N_INTERFACES).
#
# In:  MATERIAL_ID
# Out: INTERFACE, BULK_A, BULK_B, BULK_*_MATERIAL_IDS, N_A, N_B, N_INTERFACES
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Load Interface and Resolve References
units:
  - type: io
    config:
      name: io-interface
      flowchartId: io-interface
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': MATERIAL_ID}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-interface
      flowchartId: assign-interface
      operand: INTERFACE
      value: "DATA[0] if len(DATA) == 1 else None"
      input:
        - name: DATA
          scope: io-interface
  - type: assignment
    config:
      name: assign-crystal-a
      flowchartId: assign-crystal-a
      operand: CRYSTAL_A
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}])[0].get('stack_components',
        [{}])[0].get('crystal') if INTERFACE.metadata else None
  - type: assertion
    config:
      name: assert-crystal-a
      flowchartId: assert-crystal-a
      statement: "CRYSTAL_A != None"
      errorMessage: >-
        Could not extract the substrate crystal from the interface
        build metadata.
  - type: io
    config:
      name: io-bulk-a
      flowchartId: io-bulk-a
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'hash': CRYSTAL_A.get('hash')}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-bulk-a
      flowchartId: assign-bulk-a
      operand: BULK_A
      value: "DATA[0] if DATA else None"
      input:
        - name: DATA
          scope: io-bulk-a
  - type: assignment
    config:
      name: assign-bulk-a-material-ids
      flowchartId: assign-bulk-a-material-ids
      operand: BULK_A_MATERIAL_IDS
      value: "[m['_id'] for m in DATA] if DATA else []"
      input:
        - name: DATA
          scope: io-bulk-a
  - type: assertion
    config:
      name: assert-bulk-a
      flowchartId: assert-bulk-a
      statement: "BULK_A != None"
      errorMessage: >-
        No material matched the substrate crystal hash.
        Upload the bulk material first.
  - type: assignment
    config:
      name: assign-crystal-b
      flowchartId: assign-crystal-b
      operand: CRYSTAL_B
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}, {}])[1].get('stack_components',
        [{}])[0].get('crystal') if INTERFACE.metadata else None
  - type: assertion
    config:
      name: assert-crystal-b
      flowchartId: assert-crystal-b
      statement: "CRYSTAL_B != None"
      errorMessage: >-
        Could not extract the film crystal from the interface
        build metadata.
  - type: io
    config:
      name: io-bulk-b
      flowchartId: io-bulk-b
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'hash': CRYSTAL_B.get('hash')}"
              projection: "{}"
          name: DATA
  - type: assignment
    config:
      name: assign-bulk-b
      flowchartId: assign-bulk-b
      operand: BULK_B
      value: "DATA[0] if DATA else None"
      input:
        - name: DATA
          scope: io-bulk-b
  - type: assignment
    config:
      name: assign-bulk-b-material-ids
      flowchartId: assign-bulk-b-material-ids
      operand: BULK_B_MATERIAL_IDS
      value: "[m['_id'] for m in DATA] if DATA else []"
      input:
        - name: DATA
          scope: io-bulk-b
  - type: assertion
    config:
      name: assert-bulk-b
      flowchartId: assert-bulk-b
      statement: "BULK_B != None"
      errorMessage: >-
        No material matched the film crystal hash.
        Upload the bulk material first.
  - type: assignment
    config:
      name: assign-bulk-a-natoms
      flowchartId: assign-bulk-a-natoms
      operand: BULK_A_NATOMS
      value: "len(BULK_A.basis.elements)"
  - type: assignment
    config:
      name: assign-bulk-b-natoms
      flowchartId: assign-bulk-b-natoms
      operand: BULK_B_NATOMS
      value: "len(BULK_B.basis.elements)"
  - type: assignment
    config:
      name: assign-n-a
      flowchartId: assign-n-a
      operand: N_A
      value: "len([e for e in INTERFACE.basis.elements if e.value in [x.value for x in BULK_A.basis.elements]]) / BULK_A_NATOMS"
  - type: assignment
    config:
      name: assign-n-b
      flowchartId: assign-n-b
      operand: N_B
      value: "len([e for e in INTERFACE.basis.elements if e.value in [x.value for x in BULK_B.basis.elements] and e.value not in [x.value for x in BULK_A.basis.elements]]) / BULK_B_NATOMS"
  - type: assignment
    config:
      name: assign-vacuum-size
      flowchartId: assign-vacuum-size
      operand: VACUUM_SIZE
      value: >-
        (((INTERFACE.metadata.get('build') or [{}])[-1].get('configuration')
        or {}).get('stack_components') or [{}, {}, {}])[2].get('size', 0)
        if INTERFACE.metadata else 0
  - type: assignment
    config:
      name: assign-n-interfaces
      flowchartId: assign-n-interfaces
      operand: N_INTERFACES
      value: "1 if VACUUM_SIZE != 0 else 2"
