# Fetch the substrate bulk total energy for the interfacial-energy calculation.
#
# In the multi-material Interfacial Energy job the substrate bulk crystal is
# submitted as material index 1 ([0] interface, [1] substrate, [2] film). This
# subworkflow does NOT recompute the bulk: it reads the substrate's material _id
# from the job's material list and looks up the total energy from a previously
# finished Total Energy job. The substrate bulk must therefore already be
# converged/relaxed and have a finished Total Energy job on the platform.
#
# In:  JOB_ID   current job id, from the default eval context
# Out: BULK_SUBSTRATE      substrate bulk material document (for stoichiometry)
#      TE_BULK_SUBSTRATE   substrate bulk total energy (eV)
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Substrate Total Energy
units:
  - type: assignment
    config:
      name: set-material-index-substrate
      description: |
        The substrate bulk is material index 1 in this multi-material job
        ([0] interface, [1] substrate, [2] film).
      flowchartId: set-material-index-substrate
      operand: MATERIAL_INDEX
      value: "1"
  - type: io
    config:
      name: io-job-materials-substrate
      description: |
        Read the job's ordered material list so we can resolve the substrate
        bulk _id by index (the bulk itself is not recomputed here).
      flowchartId: io-job-materials-substrate
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: "{'_id': JOB_ID}"
              projection: "{'_materials': 1}"
          name: JOB_MATERIALS_DATA
  - type: assignment
    config:
      name: assign-bulk-material-id-substrate
      description: |
        The substrate bulk material _id, used to find its Total Energy job.
      flowchartId: assign-bulk-material-id-substrate
      operand: BULK_MATERIAL_ID
      value: "JOB_MATERIALS_DATA[0]['_materials'][MATERIAL_INDEX]['_id'] if JOB_MATERIALS_DATA else None"
      input:
        - name: JOB_MATERIALS_DATA
          scope: io-job-materials-substrate
  - type: io
    config:
      name: io-bulk-material-substrate
      description: |
        Load the full substrate bulk material document. Its basis is used later
        to count how many substrate formula units the interface contains.
      flowchartId: io-bulk-material-substrate
      subtype: input
      source: api
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': BULK_MATERIAL_ID}"
              projection: "{}"
          name: BULK_MATERIAL_DATA
  - type: assignment
    config:
      name: assign-bulk-substrate
      description: |
        The substrate bulk material document, exposed for the γ calculation's
        stoichiometry (N_SUBSTRATE) computation.
      flowchartId: assign-bulk-substrate
      operand: BULK_SUBSTRATE
      value: "BULK_MATERIAL_DATA[0] if BULK_MATERIAL_DATA else None"
      input:
        - name: BULK_MATERIAL_DATA
          scope: io-bulk-material-substrate
  - type: io
    config:
      name: io-bulk-te-job-substrate
      description: |
        Most recent finished Total Energy job run on the substrate bulk.
      flowchartId: io-bulk-te-job-substrate
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': BULK_MATERIAL_ID, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id-substrate
      description: |
        The _id of that Total Energy job, used to fetch its total_energy property.
      flowchartId: assign-bulk-te-job-id-substrate
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job-substrate
  - type: io
    config:
      name: io-te-bulk-substrate
      description: |
        Highest-precision total_energy produced by that job. The 'qe:' group
        restricts the match to Quantum ESPRESSO results.
      flowchartId: io-te-bulk-substrate
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'qe:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-te-bulk-substrate
      description: |
        The substrate bulk total energy (eV), consumed by the γ calculation.
      flowchartId: assign-te-bulk-substrate
      operand: TE_BULK_SUBSTRATE
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-te-bulk-substrate
  - type: assertion
    config:
      name: assert-te-bulk-substrate
      flowchartId: assert-te-bulk-substrate
      statement: "TE_BULK_SUBSTRATE != None"
      errorMessage: >-
        Bulk total energy not found for the substrate bulk (material 2 in the
        submission). Run a Total Energy workflow on the substrate bulk first.
