# Fetch precomputed film (bulk B) total energy from a finished Total Energy job.
#
# In:  BULK_B_MATERIAL_IDS
# Out: E_BULK_B
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Film Total Energy
units:
  - type: assignment
    config:
      name: assign-bulk-material-ids
      flowchartId: assign-bulk-material-ids-film
      operand: BULK_MATERIAL_IDS
      value: "BULK_B_MATERIAL_IDS"
  - type: io
    config:
      name: io-bulk-te-job-b
      flowchartId: io-bulk-te-job-b
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': {'$in': BULK_MATERIAL_IDS}, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id-b
      flowchartId: assign-bulk-te-job-id-b
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job-b
  - type: io
    config:
      name: io-e-bulk-b
      flowchartId: io-e-bulk-b
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'qe:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-e-bulk-b
      flowchartId: assign-e-bulk-b
      operand: E_BULK_B
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-e-bulk-b
  - type: assertion
    config:
      name: assert-e-bulk-b
      flowchartId: assert-e-bulk-b
      statement: "E_BULK_B != None"
      errorMessage: >-
        Bulk total energy not found for film (B).
        Run a Total Energy workflow on bulk B first.
