# Fetch precomputed film bulk total energy from a finished Total Energy job.
#
# In:  BULK_FILM_MATERIAL_IDS
# Out: TE_BULK_FILM
application:
  name: shell
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Fetch Film Total Energy
units:
  - type: assignment
    config:
      name: assign-bulk-material-ids
      flowchartId: assign-bulk-material-ids-film
      operand: BULK_MATERIAL_IDS
      value: "BULK_FILM_MATERIAL_IDS"
  - type: io
    config:
      name: io-bulk-te-job-film
      flowchartId: io-bulk-te-job-film
      subtype: input
      source: api
      input:
        - type: api
          endpoint: jobs
          endpoint_options:
            params:
              query: >-
                {'_material._id': {'$in': BULK_MATERIAL_IDS}, 'status': 'finished',
                'workflow.name': {'$regex': 'Total Energy'}}
              projection: "{'sort': {'updatedAt': -1}, 'limit': 1}"
          name: JOB_DATA
  - type: assignment
    config:
      name: assign-bulk-te-job-id-film
      flowchartId: assign-bulk-te-job-id-film
      operand: BULK_TE_JOB_ID
      value: "JOB_DATA[0]['_id'] if JOB_DATA else None"
      input:
        - name: JOB_DATA
          scope: io-bulk-te-job-film
  - type: io
    config:
      name: io-te-bulk-film
      flowchartId: io-te-bulk-film
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'source.info.jobId': BULK_TE_JOB_ID, 'slug': 'total_energy',
                'group': {'$regex': 'qe:'}}
              projection: "{'sort': {'precision.value': -1}, 'limit': 1}"
          name: DATA
  - type: assignment
    config:
      name: assign-te-bulk-film
      flowchartId: assign-te-bulk-film
      operand: TE_BULK_FILM
      value: "DATA[0].data.value if DATA else None"
      input:
        - name: DATA
          scope: io-te-bulk-film
  - type: assertion
    config:
      name: assert-te-bulk-film
      flowchartId: assert-te-bulk-film
      statement: "TE_BULK_FILM != None"
      errorMessage: >-
        Bulk total energy not found for film.
        Run a Total Energy workflow on the film bulk first.
