# Computes formation energy (eV/atom) from a material total energy already in
# context and the resolved elemental total-energy contributions.
#
# Runs after espresso/total_energy (SCF, scope 'pw-scf') and
# espresso/resolve_elemental_total_energies (TE_CONTRIBUTIONS_BY_SYMBOL).
#
# In:  total_energy (scope 'pw-scf')               material TE (eV) from pw.x
#      MATERIAL                                     material structure
#      TE_CONTRIBUTIONS_BY_SYMBOL                   map symbol -> elemental contribution row
# Out: TE_FOR_MATERIAL                              material TE (eV) in global scope
#      PRECISION_FOR_MATERIAL                       k-grid precision for the material row
#      SUM_TE_ELEMENTAL_PER_ATOM                    sum over material atoms of (ref TE / ref atom count)
#      formation_energy (property)                  (TE_FOR_MATERIAL - SUM_TE_ELEMENTAL_PER_ATOM) / N_atoms, eV/atom
#      formation_energy_contributions (property)    TE values used in the calculation
application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Calculate Formation Energy
units:
  - type: assignment
    config:
      name: assign-te-for-material
      description: |
        Assign total energy of the material from the pw.x SCF (run by the
        reused espresso/total_energy subworkflow, scope 'pw-scf') to
        TE_FOR_MATERIAL in global scope for use in the formation energy formula.
      flowchartId: assign-te-for-material
      operand: TE_FOR_MATERIAL
      value: total_energy
      input:
        - name: total_energy
          scope: pw-scf
  - type: assignment
    config:
      name: assign-precision-for-material
      description: |
        Capture the k-grid precision from the pw.x SCF context so the material
        contribution row reports the precision TE_FOR_MATERIAL was computed at.
        The unit context only carries a kgrid entry when the grid was explicitly
        set, so on the default path both values are reported as null.
      flowchartId: assign-precision-for-material
      operand: PRECISION_FOR_MATERIAL
      value: >-
        {
            "precision_value": context.get("kgrid", {}).get("gridMetricValue"),
            "precision_metric": context.get("kgrid", {}).get("gridMetricType"),
        }
      input:
        - name: context
          scope: pw-scf
  - type: assignment
    config:
      name: assign-sum-te-elemental-per-atom
      flowchartId: assign-sum-te-elemental-per-atom
      operand: SUM_TE_ELEMENTAL_PER_ATOM
      value: >-
        sum(
            TE_CONTRIBUTIONS_BY_SYMBOL[e["value"]]["total_energy_per_atom"]
            for e in MATERIAL.basis.elements
        )
  - type: assignment
    config:
      name: assign-formation-energy
      flowchartId: assign-formation-energy
      operand: FORMATION_ENERGY
      value: "(TE_FOR_MATERIAL - SUM_TE_ELEMENTAL_PER_ATOM) / len(MATERIAL.basis.elements)"
      results:
        - name: formation_energy
  - type: assignment
    config:
      name: assign-formation-energy-material-contribution
      flowchartId: assign-formation-energy-material-contribution
      operand: FORMATION_ENERGY_MATERIAL_CONTRIBUTION
      value: >-
        {
            "formula": MATERIAL.formula or MATERIAL.name,
            "n_atoms": len(MATERIAL.basis.elements),
            "is_elemental": False,
            "total_energy": TE_FOR_MATERIAL,
            "total_energy_per_atom": TE_FOR_MATERIAL / len(MATERIAL.basis.elements),
            "precision_value": PRECISION_FOR_MATERIAL["precision_value"],
            "precision_metric": PRECISION_FOR_MATERIAL["precision_metric"],
        }
  - type: assignment
    config:
      name: assign-formation-energy-contributions
      flowchartId: assign-formation-energy-contributions
      operand: FORMATION_ENERGY_CONTRIBUTIONS
      value: >-
        [FORMATION_ENERGY_MATERIAL_CONTRIBUTION] + [
            TE_CONTRIBUTIONS_BY_SYMBOL[el]
            for el in ELEMENTS
            if el in TE_CONTRIBUTIONS_BY_SYMBOL
        ]
      results:
        - name: formation_energy_contributions
