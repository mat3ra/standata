# Runs QE SCF on material and computes formation energy (eV/atom).
#
# In:  MATERIAL, ELEMENTS, ELEMENT_MATERIALS, ELEMENT_MATERIAL_IDS_BY_SYMBOL
# Out: total_energy (property)                        material TE (eV) from pw.x
#      TE_FOR_MATERIAL                                 material TE (eV) in global scope
#      SOURCE_OF_TE_FOR_AN_ELEMENT                     where to fetch elemental TE (my_account/curators/public)
#      GROUP_FOR_MATERIAL                              property group slug for TE lookup
#      TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL        map symbol -> selected total_energy holder, highest precision
#      TE_CONTRIBUTIONS_BY_SYMBOL                      map symbol -> normalized elemental contribution row
#      SUM_TE_ELEMENTAL_PER_ATOM                       sum over material atoms of (ref TE / ref atom count)
#      formation_energy (property)                     (TE_FOR_MATERIAL - SUM_TE_ELEMENTAL_PER_ATOM) / N_atoms, eV/atom
#      formation_energy_contributions (property)         TE values used in the calculation
#      PRECISION_FOR_MATERIAL                          precision from pw-scf kgrid context for material row
application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Formation Energy
units:
  - config:
      execName: pw.x
      flavorName: pw_scf
      flowchartId: pw-scf
      name: pw_scf
    type: executionBuilder
  - type: assignment
    config:
      name: assign-te-for-material
      description: |
        Assign total energy of the material from pw.x SCF to TE_FOR_MATERIAL
        in global scope for use in formation energy calculation.
      flowchartId: assign-te-for-material
      operand: TE_FOR_MATERIAL
      value: total_energy
      input:
        - name: total_energy
          scope: pw-scf
  - type: assignment
    config:
      name: assign-source-of-te-for-an-element
      description: |
        Source of elemental total energy data:
        - 'my_account' if the user is the owner of the elemental reference material(s)
        - 'curators' if the user is a curator of the elemental reference material(s)
        - 'public' if the user is not the owner or curator of the elemental reference material(s)
      flowchartId: assign-source-of-te-for-an-element
      operand: SOURCE_OF_TE_FOR_AN_ELEMENT
      value: "'public'"
  - type: assignment
    config:
      name: assign-group-for-material
      description: |
        Property group slug for the material's computational method.
        DFT model groupSlug: {app.shortName}:{model.type}:{model.subtype}:{model.functional}.
        Used to filter elemental total energies by the same method.
      flowchartId: assign-group-for-material
      operand: GROUP_FOR_MATERIAL
      value: "'qe:dft:gga:pbe'"
  - type: assignment
    config:
      name: init-element-index
      flowchartId: init-element-index
      operand: ELEMENT_INDEX
      value: "0"
  - type: assignment
    config:
      name: init-te-for-elemental-materials-map-by-symbol
      flowchartId: init-te-for-elemental-materials-map-by-symbol
      operand: TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL
      value: "{}"
  - type: condition
    config:
      name: check-te-for-elemental-materials-loop
      flowchartId: check-te-for-elemental-materials-loop
      statement: "ELEMENT_INDEX >= len(ELEMENTS)"
      then: assign-missing-te-for-element-symbols
      else: assign-current-element
  - type: assignment
    config:
      name: assign-current-element
      flowchartId: assign-current-element
      operand: CURRENT_ELEMENT
      value: "ELEMENTS[ELEMENT_INDEX]"
  - type: io
    config:
      name: io-te-for-an-element
      flowchartId: io-te-for-an-element
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL,
                'owner.slug': {'$in': [JOB_OWNER_SLUG, 'curators']}}
                if SOURCE_OF_TE_FOR_AN_ELEMENT == 'my_account' else
                ({'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL,
                'owner.slug': 'curators'}
                if SOURCE_OF_TE_FOR_AN_ELEMENT == 'curators' else
                {'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL})
              projection: >-
                {
                    "sort": {"precision.value": -1},
                    "limit": 1,
                }
          name: DATA
  - type: assignment
    config:
      name: assign-te-for-elemental-materials-map-by-symbol
      flowchartId: assign-te-for-elemental-materials-map-by-symbol
      operand: TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL
      value: >-
        {**TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL, CURRENT_ELEMENT: DATA[0] if DATA else None}
      input:
        - name: DATA
          scope: io-te-for-an-element
  - type: assignment
    config:
      name: increment-element-index
      flowchartId: increment-element-index
      operand: ELEMENT_INDEX
      value: "ELEMENT_INDEX + 1"
      next: check-te-for-elemental-materials-loop
  - type: assignment
    config:
      name: assign-missing-te-for-element-symbols
      flowchartId: assign-missing-te-for-element-symbols
      operand: MISSING_TE_FOR_ELEMENT_SYMBOLS
      value: >-
        [el for el in ELEMENTS if TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el] is None]
      next: assert-te-for-elemental-materials-found
  - type: assertion
    config:
      enableRender: true
      name: assert-te-for-elemental-materials-found
      flowchartId: assert-te-for-elemental-materials-found
      statement: "len(MISSING_TE_FOR_ELEMENT_SYMBOLS) == 0"
      errorMessage: >-
        Missing total_energy for elemental reference material(s)
        {{ MISSING_TE_FOR_ELEMENT_SYMBOLS | join(', ') }}.
        Run the QE Total Energy workflow for the corresponding Standata
        elemental material(s) before running Formation Energy.
  - type: assignment
    config:
      name: assign-te-contributions-by-symbol
      flowchartId: assign-te-contributions-by-symbol
      operand: TE_CONTRIBUTIONS_BY_SYMBOL
      value: >-
        {
            el: {
                "formula": el,
                "n_atoms": len(ELEMENT_MATERIALS[el].basis.elements),
                "is_elemental": True,
                "total_energy": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].data.value,
                "total_energy_per_atom": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].data.value
                / len(ELEMENT_MATERIALS[el].basis.elements),
                "precision_value": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].precision.value,
                "precision_metric": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].precision.metric,
            }
            for el in ELEMENTS
            if TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el]
        }
  - type: assignment
    config:
      name: assign-sum-te-elemental-per-atom
      flowchartId: assign-sum-te-elemental-per-atom
      operand: SUM_TE_ELEMENTAL_PER_ATOM
      value: >-
        sum(
            TE_CONTRIBUTIONS_BY_SYMBOL[e["value"]]["total_energy_per_atom"]
            for e in MATERIAL.basis.elements
        )
  - type: assignment
    config:
      name: assign-formation-energy
      flowchartId: assign-formation-energy
      operand: FORMATION_ENERGY
      value: "(TE_FOR_MATERIAL - SUM_TE_ELEMENTAL_PER_ATOM) / len(MATERIAL.basis.elements)"
      results:
        - name: formation_energy
  - type: assignment
    config:
      name: assign-precision-for-material
      flowchartId: assign-precision-for-material
      operand: PRECISION_FOR_MATERIAL
      value: >-
        {
            "precision_value": context["kgrid"].get("gridMetricValue"),
            "precision_metric": context["kgrid"].get("gridMetricType"),
        }
      input:
        - name: context
          scope: pw-scf
  - type: assignment
    config:
      name: assign-formation-energy-material-contribution
      flowchartId: assign-formation-energy-material-contribution
      operand: FORMATION_ENERGY_MATERIAL_CONTRIBUTION
      value: >-
        {
            "formula": MATERIAL.formula or MATERIAL.name,
            "n_atoms": len(MATERIAL.basis.elements),
            "is_elemental": False,
            "total_energy": TE_FOR_MATERIAL,
            "total_energy_per_atom": TE_FOR_MATERIAL / len(MATERIAL.basis.elements),
            "precision_value": PRECISION_FOR_MATERIAL["precision_value"],
            "precision_metric": PRECISION_FOR_MATERIAL["precision_metric"],
        }
  - type: assignment
    config:
      name: assign-formation-energy-contributions
      flowchartId: assign-formation-energy-contributions
      operand: FORMATION_ENERGY_CONTRIBUTIONS
      value: >-
        [FORMATION_ENERGY_MATERIAL_CONTRIBUTION] + [
            TE_CONTRIBUTIONS_BY_SYMBOL[el]
            for el in ELEMENTS
            if el in TE_CONTRIBUTIONS_BY_SYMBOL
        ]
      results:
        - name: formation_energy_contributions
