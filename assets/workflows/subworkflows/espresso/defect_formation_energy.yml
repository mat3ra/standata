# Computes the defect formation energy (eV) of charge state CHARGE, with the
# Fermi level at the pristine valence band maximum, from the defective-cell
# total energy already in context, the pristine total energy, the resolved
# elemental total-energy contributions and, for CHARGE ≠ 0, the pristine VBM:
#   E_defect = TE_FOR_MATERIAL − E_PRISTINE − Σ_i ΔN_i · μ_i + CHARGE · E_VBM
#
# Runs after espresso/total_energy (SCF on the defective cell, scope 'pw-scf'),
# shell/fetch_bulk_total_energy (PRISTINE, E_PRISTINE), shell/fetch_valence_band_maximum
# (E_VBM) and espresso/resolve_elemental_total_energies (TE_CONTRIBUTIONS_BY_SYMBOL).
#
# In:  total_energy (scope 'pw-scf')   defective-cell TE (eV) from pw.x
#      MATERIAL (defective), PRISTINE, E_PRISTINE, E_VBM
#      ELEMENTS, TE_CONTRIBUTIONS_BY_SYMBOL
# Out: TE_FOR_MATERIAL                  defective-cell TE (eV) in global scope
#      defect_formation_energy (property)
application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Calculate Defect Formation Energy
units:
  - type: assignment
    config:
      name: assign-charge
      description: |
        Net charge q of the defective supercell in units of e; must equal
        tot_charge of its pw_scf.
      flowchartId: assign-charge
      operand: CHARGE
      value: "0"

  - type: assertion
    config:
      name: assert-vbm-for-charge
      flowchartId: assert-vbm-for-charge
      statement: "CHARGE == 0 or E_VBM != None"
      errorMessage: >-
        Valence band maximum not found for the pristine material. Run a Band Gap
        workflow on it before computing a charged defect.

  - type: assignment
    config:
      name: assign-te-for-material
      description: |
        Total energy of the defective supercell (eV) from the pw.x SCF run by
        the reused espresso/total_energy subworkflow (scope 'pw-scf').
      flowchartId: assign-te-for-material
      operand: TE_FOR_MATERIAL
      value: total_energy
      input:
        - name: total_energy
          scope: pw-scf

  - type: assignment
    config:
      name: assign-delta-n-by-symbol
      description: |
        Per-species atom-count change ΔN_i = count(defective) − count(pristine).
        Vacancy: ΔN = −1; interstitial: ΔN = +1; antisite: combination.
      flowchartId: assign-delta-n-by-symbol
      operand: DELTA_N_BY_SYMBOL
      value: >-
        {
            el: len([e for e in MATERIAL.basis.elements if e["value"] == el])
              - len([e for e in PRISTINE.basis.elements if e["value"] == el])
            for el in ELEMENTS
        }

  - type: assignment
    config:
      name: assign-sum-delta-n-times-mu
      description: |
        Chemical-potential correction Σ_i ΔN_i · μ_i, with
        μ_i = elemental total_energy_per_atom.
      flowchartId: assign-sum-delta-n-times-mu
      operand: SUM_DELTA_N_TIMES_MU
      value: >-
        sum(
            DELTA_N_BY_SYMBOL[el] * TE_CONTRIBUTIONS_BY_SYMBOL[el]["total_energy_per_atom"]
            for el in ELEMENTS
            if el in TE_CONTRIBUTIONS_BY_SYMBOL
        )

  - type: assignment
    config:
      name: assign-defect-formation-energy
      description: |
        Defect formation energy (eV) at the pristine valence band maximum:
        TE_FOR_MATERIAL − E_PRISTINE − Σ_i ΔN_i · μ_i + CHARGE · E_VBM.
      flowchartId: assign-defect-formation-energy
      operand: DEFECT_FORMATION_ENERGY
      value: "TE_FOR_MATERIAL - E_PRISTINE - SUM_DELTA_N_TIMES_MU + (CHARGE * E_VBM if CHARGE else 0)"
      results:
        - name: defect_formation_energy
