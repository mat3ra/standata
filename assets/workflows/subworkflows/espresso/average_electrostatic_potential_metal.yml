application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Average Electrostatic Potential (Metal)
units:
  - config:
      name: Set Material Index (Metal)
      operand: MATERIAL_INDEX
      value: "2"
    type: assignment
  - config:
      execName: pw.x
      flavorName: pw_scf
      name: pw_scf
    type: executionBuilder
  - config:
      execName: pp.x
      flavorName: pp_electrostatic_potential
      name: Electrostatic Potential (ESP)
    type: executionBuilder
  - config:
      execName: average.x
      flavorName: average_potential
      name: average ESP
      flowchartId: average-electrostatic-potential-metal
    type: executionBuilder
  - config:
      name: Set Average ESP Value (Metal)
      operand: AVG_ESP_METAL
      value: "[np.mean(average_potential_profile['yDataSeries'][1])]"
      input:
        - name: average_potential_profile
          scope: average-electrostatic-potential-metal
    type: assignment
