# Resolves the total energy (eV) of each elemental reference material and
# normalizes it into a per-symbol contribution row. Shared by every workflow
# that references elemental chemical potentials (formation energy, defect
# formation energy, ...) so the elemental-TE lookup lives in one place.
#
# Fetches the highest-precision total_energy for each element's Standata
# reference material(s), filtered to the same computational method as the
# target material (GROUP_FOR_MATERIAL), then asserts none are missing.
#
# In:  ELEMENTS                        sorted unique element symbols
#      ELEMENT_MATERIALS               map symbol -> elemental ref material doc
#      ELEMENT_MATERIAL_IDS_BY_SYMBOL  map symbol -> candidate exabyteIds
# Out: SOURCE_OF_TE_FOR_AN_ELEMENT     where elemental TE was fetched from
#      GROUP_FOR_MATERIAL              property group slug used for the lookup
#      TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL  map symbol -> selected TE holder
#      TE_CONTRIBUTIONS_BY_SYMBOL      map symbol -> normalized elemental contribution row
application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Resolve Total Energies for Elemental Materials
units:
  - type: assignment
    config:
      name: assign-source-of-te-for-an-element
      description: |
        Source of elemental total energy data:
        - 'my_account' if the user is the owner of the elemental reference material(s)
        - 'curators' if the user is a curator of the elemental reference material(s)
        - 'public' if the user is not the owner or curator of the elemental reference material(s)
      flowchartId: assign-source-of-te-for-an-element
      operand: SOURCE_OF_TE_FOR_AN_ELEMENT
      value: "'public'"
  - type: assignment
    config:
      name: assign-group-for-material
      description: |
        Property group slug for the material's computational method.
        DFT model groupSlug: {app.shortName}:{model.type}:{model.subtype}:{model.functional}.
        Used to filter elemental total energies by the same method.
      flowchartId: assign-group-for-material
      operand: GROUP_FOR_MATERIAL
      value: "'qe:dft:gga:pbe'"
  - type: assignment
    config:
      name: init-element-index
      flowchartId: init-element-index
      operand: ELEMENT_INDEX
      value: "0"
  - type: assignment
    config:
      name: init-te-for-elemental-materials-map-by-symbol
      flowchartId: init-te-for-elemental-materials-map-by-symbol
      operand: TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL
      value: "{}"
  - type: condition
    config:
      name: check-te-for-elemental-materials-loop
      flowchartId: check-te-for-elemental-materials-loop
      statement: "ELEMENT_INDEX >= len(ELEMENTS)"
      then: assign-missing-te-for-element-symbols
      else: assign-current-element
  - type: assignment
    config:
      name: assign-current-element
      flowchartId: assign-current-element
      operand: CURRENT_ELEMENT
      value: "ELEMENTS[ELEMENT_INDEX]"
  - type: io
    config:
      name: io-te-for-an-element
      flowchartId: io-te-for-an-element
      subtype: input
      source: api
      input:
        - type: api
          endpoint: properties
          endpoint_options:
            params:
              query: >-
                {'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL,
                'owner.slug': {'$in': [JOB_OWNER_SLUG, 'curators']}}
                if SOURCE_OF_TE_FOR_AN_ELEMENT == 'my_account' else
                ({'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL,
                'owner.slug': 'curators'}
                if SOURCE_OF_TE_FOR_AN_ELEMENT == 'curators' else
                {'exabyteId': {'$in': ELEMENT_MATERIAL_IDS_BY_SYMBOL[CURRENT_ELEMENT]},
                'slug': 'total_energy', 'group': GROUP_FOR_MATERIAL})
              projection: >-
                {
                    "sort": {"precision.value": -1},
                    "limit": 1,
                }
          name: DATA
  - type: assignment
    config:
      name: assign-te-for-elemental-materials-map-by-symbol
      flowchartId: assign-te-for-elemental-materials-map-by-symbol
      operand: TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL
      value: >-
        {**TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL, CURRENT_ELEMENT: DATA[0] if DATA else None}
      input:
        - name: DATA
          scope: io-te-for-an-element
  - type: assignment
    config:
      name: increment-element-index
      flowchartId: increment-element-index
      operand: ELEMENT_INDEX
      value: "ELEMENT_INDEX + 1"
      next: check-te-for-elemental-materials-loop
  - type: assignment
    config:
      name: assign-missing-te-for-element-symbols
      flowchartId: assign-missing-te-for-element-symbols
      operand: MISSING_TE_FOR_ELEMENT_SYMBOLS
      value: >-
        [el for el in ELEMENTS if TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el] is None]
      next: assert-te-for-elemental-materials-found
  - type: assertion
    config:
      enableRender: true
      name: assert-te-for-elemental-materials-found
      flowchartId: assert-te-for-elemental-materials-found
      statement: "len(MISSING_TE_FOR_ELEMENT_SYMBOLS) == 0"
      errorMessage: >-
        Missing total_energy for elemental reference material(s)
        {{ MISSING_TE_FOR_ELEMENT_SYMBOLS | join(', ') }}.
        Run the QE Total Energy workflow for the corresponding Standata
        elemental material(s) before running this workflow.
  - type: assignment
    config:
      name: assign-te-contributions-by-symbol
      flowchartId: assign-te-contributions-by-symbol
      operand: TE_CONTRIBUTIONS_BY_SYMBOL
      value: >-
        {
            el: {
                "formula": el,
                "n_atoms": len(ELEMENT_MATERIALS[el].basis.elements),
                "is_elemental": True,
                "total_energy": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].data.value,
                "total_energy_per_atom": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].data.value
                / len(ELEMENT_MATERIALS[el].basis.elements),
                "precision_value": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].precision.value,
                "precision_metric": TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el].precision.metric,
            }
            for el in ELEMENTS
            if TE_FOR_ELEMENTAL_MATERIALS_MAP_BY_SYMBOL[el]
        }
