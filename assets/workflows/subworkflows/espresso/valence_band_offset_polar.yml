application:
  name: python
  version: 3.10.13
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Python VBO Polar PostProcess
units:
  - attributes:
      input:
        - template:
            name: script.py
            applicationName: python
            applicationVersion: "*"
            executableName: python
            contextProviders: []
            content: !readFile 'assets/applications/input_files_templates/python/valence_band_offset_polar.pyi'
          rendered: ""
          isManuallyChanged: false
        - template:
            name: requirements.txt
            applicationName: python
            applicationVersion: "*"
            executableName: python
            contextProviders: []
            # yamllint disable-line rule:line-length
            content: !readFile 'assets/applications/input_files_templates/python/requirements_valence_band_offset_polar.j2.txt'
          rendered: ""
          isManuallyChanged: false
      results:
        - name: file_content
          basename: "polar_vbo_fit_interface.png"
          filetype: "image"
    config:
      name: Get VBO for Polar material
      execName: python
      flavorName: hello_world
      flowchartId: python-polar-vbo
    type: executionBuilder
  - config:
      name: Valence Band Offset
      operand: VALENCE_BAND_OFFSET
      value: 'json.loads(STDOUT.splitlines()[-1])["valence_band_offset"]'
      input:
        - name: STDOUT
          scope: python-polar-vbo
      results:
        - name: valence_band_offset
    type: assignment
