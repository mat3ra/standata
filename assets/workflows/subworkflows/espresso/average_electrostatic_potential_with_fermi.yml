application:
  name: espresso
  version: "6.3"
method:
  name: PseudopotentialMethod
model:
  name: DFTModel
name: Fermi Energy + average ESP
units:
  - config:
      name: Set Material Index
      operand: MATERIAL_INDEX
      value: 0
    type: assignment
  - config:
      execName: pw.x
      flavorName: pw_scf
      name: pw_scf
      flowchartId: pw-scf-fermi-energy
    type: executionBuilder
  - config:
      name: Set Fermi Energy
      operand: E_FERMI
      value: fermi_energy
      input:
        - name: fermi_energy
          scope: pw-scf-fermi-energy
    type: assignment
  - config:
      execName: pp.x
      flavorName: pp_electrostatic_potential
      name: Electrostatic Potential (ESP)
    type: executionBuilder
  - config:
      execName: average.x
      flavorName: average_potential
      name: average ESP
      flowchartId: average-electrostatic-potential-fermi
    type: executionBuilder
  - config:
      name: Set Macroscopically Averaged ESP Data
      operand: array_from_context
      value: "average_potential_profile['yDataSeries'][1]"
      input:
        - name: average_potential_profile
          scope: average-electrostatic-potential-fermi
    type: assignment
