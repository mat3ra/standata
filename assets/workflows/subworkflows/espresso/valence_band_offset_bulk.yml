# Part of the Valence Band Offset (Bulk Method) workflow, NOT self-sufficient: its script reads INTERFACE, LEFT_BULK,
# RIGHT_BULK, VBM_LEFT, VBM_RIGHT, and each ESP subworkflow's average_potential_profile.
application:
  name: python
  version: 3.10.13
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Calculate VBO (Bulk Method)
units:
  - attributes:
      input:
        - template:
            name: script.py
            applicationName: python
            applicationVersion: "*"
            executableName: python
            contextProviders: []
            content: !readFile 'assets/applications/input_files_templates/python/valence_band_offset_bulk.pyi'
        - template:
            name: requirements.txt
            applicationName: python
            applicationVersion: "*"
            executableName: python
            contextProviders: []
            # yamllint disable-line rule:line-length
            content: !readFile 'assets/applications/input_files_templates/python/requirements_valence_band_offset_bulk.j2.txt'
    config:
      name: Calculate VBO (Bulk Method)
      execName: python
      # hello_world with the script inline: a new python flavor fails job creation until the web-app pins this Standata
      flavorName: hello_world
      flowchartId: python-valence-band-offset-bulk
    type: executionBuilder
  - config:
      name: Valence Band Offset
      operand: VALENCE_BAND_OFFSET
      value: 'json.loads(STDOUT.splitlines()[-1])["valence_band_offset"]'
      input:
        - name: STDOUT
          scope: python-valence-band-offset-bulk
      results:
        - name: valence_band_offset
    type: assignment
