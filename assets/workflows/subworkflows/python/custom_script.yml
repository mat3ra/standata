application:
  name: python
  version: 3.10.13
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Custom Python Script
units:
  - config:
      name: io-user-files
      subtype: input
      source: object_storage
      input: []
    type: io
  - config:
      name: io-material
      subtype: input
      source: api
      flowchartId: custom-script-io-material
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': MATERIAL_ID}"
              projection: "{}"
          name: DATA
    type: io
  - config:
      name: assign-material
      operand: MATERIAL
      value: "DATA[0]"
      input:
        - name: DATA
          scope: custom-script-io-material
    type: assignment
  - config:
      execName: python
      flavorName: hello_world
      name: custom_script
    type: executionBuilder
