application:
  name: python
  version: 3.10.13
method:
  name: UnknownMethod
model:
  name: UnknownModel
name: Custom Python Script
units:
  # Fetches the user's script, and any files it reads, from object storage. The inputs are added
  # per job — one entry per uploaded file — since the objects only exist once they are uploaded.
  - config:
      name: io-user-files
      subtype: input
      source: object_storage
      flowchartId: io-user-files-flowchart-id-6b1f74c2
      input: []
    type: io
  - config:
      name: io-material
      subtype: input
      source: api
      flowchartId: io-material-flowchart-id-1d9a0e57
      input:
        - type: api
          endpoint: materials
          endpoint_options:
            params:
              query: "{'_id': MATERIAL_ID}"
              projection: "{}"
          name: DATA
    type: io
  - config:
      name: assign-material
      operand: MATERIAL
      value: "DATA[0]"
      input:
        - name: DATA
          scope: io-material-flowchart-id-1d9a0e57
    type: assignment
  - config:
      execName: python
      flavorName: hello_world
      name: custom_script
    type: executionBuilder
