# Defect formation energy (eV), neutral defects only:
#   E_defect = E_defective − E_pristine − Σ_i ΔN_i · μ_i
#
# Multi-material workflow — submit two materials, in this order:
#   [0] Defective supercell   (computed with pw_scf)
#   [1] Pristine supercell    (energy fetched from its finished Total Energy job)
#
# Prerequisite: QE Total Energy already run on the pristine material.
name: Defect Formation Energy
config:
  attributes:
    isMultiMaterial: true
properties:
  - atomic_forces
  - defect_formation_energy
  - fermi_energy
  - pressure
  - stress_tensor
  - total_energy
  - total_energy_contributions
  - total_force
units:
  - name: shell/utils/get_material_by_index
    type: subworkflow
    config:
      attributes:
        name: Load Defective Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            flowchartId: set-material-index-defective

  # Compute the defective-cell total energy (reused Total Energy SCF) while
  # MATERIAL_INDEX is still 0 -- before fetch_bulk_total_energy moves it to the
  # pristine cell. The pw_scf scope is pinned to 'pw-scf' so the property
  # subworkflow can read its total_energy.
  - name: total_energy
    type: subworkflow
    config:
      attributes:
        name: Compute Total Energy for Defective Material
    unitConfigs:
      - index: 0
        type: executionBuilder
        config:
          attributes:
            flowchartId: pw-scf

  - name: shell/utils/get_material_by_index
    type: subworkflow
    config:
      attributes:
        name: Load Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            flowchartId: set-material-index-pristine
            value: "1"
      - index: 1
        type: io
        config:
          attributes:
            flowchartId: io-job-pristine
      - index: 2
        type: assignment
        config:
          attributes:
            flowchartId: assign-material-id-pristine
            input:
              - name: DATA
                scope: io-job-pristine
      - index: 3
        type: io
        config:
          attributes:
            flowchartId: io-material-pristine
      - index: 4
        type: assignment
        config:
          attributes:
            flowchartId: assign-material-pristine
            operand: PRISTINE
            input:
              - name: DATA
                scope: io-material-pristine

  - name: shell/fetch_bulk_total_energy
    type: subworkflow
    config:
      attributes:
        name: Fetch Total Energy for Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            value: "PRISTINE['_id']"
      - index: 4
        type: assignment
        config:
          attributes:
            operand: E_PRISTINE
      - index: 5
        type: assertion
        config:
          attributes:
            statement: "E_PRISTINE != None"
            errorMessage: >-
              Pristine total energy not found. Run a Total Energy workflow on
              the pristine material before running Defect Formation Energy.

  - name: shell/utils/resolve_elemental_materials
    type: subworkflow
    config:
      attributes:
        name: Resolve Elemental Materials

  - name: resolve_elemental_total_energies
    type: subworkflow

  - name: defect_formation_energy
    type: subworkflow
