# Defect formation energy (eV) of charge state q, with the Fermi level at the
# valence band maximum of the pristine cell (μ_e = 0):
#   E_defect = E_defective − E_pristine − Σ_i ΔN_i · μ_i + q · E_VBM
#
# Multi-material workflow — submit two materials, in this order:
#   [0] Defective supercell   (computed with pw_scf)
#   [1] Pristine supercell    (energy fetched from its finished Total Energy job)
#
# Prerequisites: QE Total Energy on the pristine material; for q ≠ 0 also QE Band
# Gap on it (E_VBM). A charged run sets q twice: tot_charge in pw_scf and the
# CHARGE assignment of the defect formation energy subworkflow. REFERENCE_TAGS
# picks each pristine reference from the one tagged job that computes it: the
# total energy from a total_energy job, E_VBM from a band_gaps job.
name: Defect Formation Energy
config:
  attributes:
    isMultiMaterial: true
properties:
  - atomic_forces
  - defect_formation_energy
  - fermi_energy
  - pressure
  - stress_tensor
  - total_energy
  - total_energy_contributions
  - total_force
units:
  - name: shell/utils/get_material_by_index
    type: subworkflow
    config:
      attributes:
        name: Load Defective Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            flowchartId: set-material-index-defective

  # Compute the defective-cell total energy (reused Total Energy SCF) while
  # MATERIAL_INDEX is still 0 -- before fetch_bulk_total_energy moves it to the
  # pristine cell. The pw_scf scope is pinned to 'pw-scf' so the property
  # subworkflow can read its total_energy.
  - name: total_energy
    type: subworkflow
    config:
      attributes:
        name: Compute Total Energy for Defective Material
    unitConfigs:
      - index: 0
        type: executionBuilder
        config:
          attributes:
            flowchartId: pw-scf

  - name: shell/utils/get_material_by_index
    type: subworkflow
    config:
      attributes:
        name: Load Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            flowchartId: set-material-index-pristine
            value: "1"
      - index: 1
        type: io
        config:
          attributes:
            flowchartId: io-job-pristine
      - index: 2
        type: assignment
        config:
          attributes:
            flowchartId: assign-material-id-pristine
            input:
              - name: DATA
                scope: io-job-pristine
      - index: 3
        type: io
        config:
          attributes:
            flowchartId: io-material-pristine
      - index: 4
        type: assignment
        config:
          attributes:
            flowchartId: assign-material-pristine
            operand: PRISTINE
            input:
              - name: DATA
                scope: io-material-pristine

  - name: shell/utils/find_job_by_tags
    type: subworkflow
    config:
      attributes:
        name: Find Total Energy Job for Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            value: "PRISTINE"

  - name: shell/fetch_bulk_total_energy
    type: subworkflow
    config:
      attributes:
        name: Fetch Total Energy for Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            value: "PRISTINE"
      - index: 2
        type: assignment
        config:
          attributes:
            value: "REFERENCE_JOB_FILTER"
      - index: 4
        type: assignment
        config:
          attributes:
            operand: E_PRISTINE
      - index: 5
        type: assertion
        config:
          attributes:
            statement: "E_PRISTINE != None"
            errorMessage: >-
              Pristine total energy not found. Run a Total Energy workflow on
              the pristine material before running Defect Formation Energy.

  # Same tags, its own job: the band_gaps reference is looked up on its own so it
  # can never be crowded out by, or confused with, the total energy one.
  - name: shell/utils/find_job_by_tags
    type: subworkflow
    config:
      attributes:
        name: Find Band Gap Job for Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            flowchartId: assign-tagged-job-material-vbm
            value: "PRISTINE"
      - index: 1
        type: assignment
        config:
          attributes:
            flowchartId: assign-reference-tags-vbm
            value: "REFERENCE_TAGS"
      - index: 2
        type: assignment
        config:
          attributes:
            flowchartId: assign-reference-property-vbm
            value: "'band_gaps'"
      - index: 3
        type: io
        config:
          attributes:
            flowchartId: io-tagged-job-vbm
      - index: 4
        type: assignment
        config:
          attributes:
            flowchartId: assign-reference-job-filter-vbm
            operand: VBM_REFERENCE_JOB_FILTER
            input:
              - name: DATA
                scope: io-tagged-job-vbm

  - name: shell/fetch_valence_band_maximum
    type: subworkflow
    config:
      attributes:
        name: Fetch Valence Band Maximum for Pristine Material
    unitConfigs:
      - index: 0
        type: assignment
        config:
          attributes:
            value: "PRISTINE"
      - index: 2
        type: assignment
        config:
          attributes:
            value: "VBM_REFERENCE_JOB_FILTER"

  - name: shell/utils/resolve_elemental_materials
    type: subworkflow
    config:
      attributes:
        name: Resolve Elemental Materials

  - name: resolve_elemental_total_energies
    type: subworkflow

  - name: defect_formation_energy
    type: subworkflow
