# Interfacial energy γ (eV/Å²):
#   TE_excess = TE_interface - N_substrate × TE_bulk_substrate - N_film × TE_bulk_film
#   γ = TE_excess / (N_interfaces × area)
#
# Single-material workflow:
#   The job requires one material: the interface (heterostructure).
#   Substrate and film bulk materials are resolved automatically from the
#   interface's metadata.build crystal hashes.
#
# Bulk total energies are fetched from pre-computed properties.
name: Interfacial Energy
properties:
  - total_energy
  - total_energy_contributions
  - atomic_forces
  - fermi_energy
  - pressure
  - stress_tensor
  - total_force
  - interfacial_energy
units:
  - name: shell/load_interface_and_resolve_references
    type: subworkflow

  - name: shell/fetch_substrate_bulk_total_energy
    type: subworkflow

  - name: shell/fetch_film_bulk_total_energy
    type: subworkflow

  - name: interfacial_energy_scf
    type: subworkflow

  - name: shell/interfacial_energy
    type: subworkflow
