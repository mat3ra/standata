# Interfacial energy γ (eV/Å²):
#   E_excess = E_interface - N_A × E_bulk_A - N_B × E_bulk_B
#   γ = E_excess / (N_interfaces × A)
#
# Single-material workflow:
#   The job requires one material: the interface (heterostructure).
#   Bulk materials A (substrate) and B (film) are resolved automatically
#   from the interface's metadata.build crystal hashes.
#
# Bulk total energies are fetched from pre-computed properties.
name: Interfacial Energy
properties:
  - total_energy
  - total_energy_contributions
  - atomic_forces
  - fermi_energy
  - pressure
  - stress_tensor
  - total_force
  - interfacial_energy
units:
  - name: shell/prepare_interfacial_energy
    type: subworkflow

  - name: shell/fetch_substrate_bulk_total_energy
    type: subworkflow

  - name: shell/fetch_film_bulk_total_energy
    type: subworkflow

  - name: interfacial_energy_scf
    type: subworkflow

  - name: shell/interfacial_energy
    type: subworkflow
